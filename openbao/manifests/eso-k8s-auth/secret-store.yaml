# ESO SecretStore with OpenBao Kubernetes authentication
# Note: ESO uses the Vault provider for OpenBao (API compatible)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-secret-store
  namespace: openbao-eso-test
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-role"
          serviceAccountRef:
            name: openbao-eso-sa
