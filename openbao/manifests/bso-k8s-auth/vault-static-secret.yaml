# VaultStaticSecret for OpenBao BSO Kubernetes Auth pattern
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: app-secrets
  namespace: openbao-bso-test
spec:
  vaultAuthRef: openbao-auth
  mount: secret
  type: kv-v2
  path: myapp
  refreshAfter: 30s
  destination:
    name: app-secrets
    create: true
    annotations:
      reloader.stakater.com/match: "true"
