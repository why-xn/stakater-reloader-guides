apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: conjur-secret-store
  namespace: eso-test-app
spec:
  provider:
    conjur:
      url: https://conjur-conjur-oss.conjur.svc.cluster.local
      caBundle: 
      auth:
        apikey:
          account: myaccount
          userRef:
            name: conjur-credentials
            key: hostId
          apiKeyRef:
            name: conjur-credentials
            key: apikey
