apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: conjur-jwt-secret-store
  namespace: eso-jwt-test
spec:
  provider:
    conjur:
      url: https://conjur-conjur-oss.conjur.svc.cluster.local
      caBundle: 
      auth:
        jwt:
          account: myaccount
          serviceID: dev
          serviceAccountRef:
            name: eso-jwt-sa
            audiences:
              - https://conjur-conjur-oss.conjur.svc.cluster.local
