apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwt-test-app
  namespace: jwt-test-app
  annotations:
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwt-test-app
  template:
    metadata:
      labels:
        app: jwt-test-app
      annotations:
        # Sidecar mode annotations for secrets-provider
        conjur.org/container-mode: sidecar
        conjur.org/secrets-refresh-interval: 30s
    spec:
      serviceAccountName: jwt-test-app-sa
      containers:
      - name: app
        image: busybox:latest
        command: ["sh", "-c", "while true; do echo 'Secrets:'; echo \"Username: $APP_USERNAME\"; echo \"Password: $APP_PASSWORD\"; sleep 30; done"]
        env:
        - name: APP_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: username
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: password
      - name: conjur-secrets-provider
        image: cyberark/secrets-provider-for-k8s:1.6.1
        imagePullPolicy: IfNotPresent
        env:
        - name: CONJUR_ACCOUNT
          valueFrom:
            configMapKeyRef:
              name: conjur-connect
              key: CONJUR_ACCOUNT
        - name: CONJUR_APPLIANCE_URL
          valueFrom:
            configMapKeyRef:
              name: conjur-connect
              key: CONJUR_APPLIANCE_URL
        # Override CONJUR_AUTHN_URL for JWT auth (ConfigMap has authn-k8s URL)
        - name: CONJUR_AUTHN_URL
          value: "https://conjur-conjur-oss.conjur.svc.cluster.local/authn-jwt/dev"
        # Use file-based SSL certificate for better handling of multi-line PEM
        - name: CONJUR_SSL_CERTIFICATE
          valueFrom:
            configMapKeyRef:
              name: conjur-connect
              key: CONJUR_SSL_CERTIFICATE
        - name: SSL_CERT_FILE
          value: /etc/ssl/conjur/conjur.pem
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_SECRETS
          value: "app-secrets"
        - name: SECRETS_DESTINATION
          value: "k8s_secrets"
        # CONTAINER_MODE via env var (also set via annotation)
        - name: CONTAINER_MODE
          value: "sidecar"
        - name: DEBUG
          value: "true"
        - name: JWT_TOKEN_PATH
          value: /var/run/secrets/tokens/jwt
        volumeMounts:
        - name: conjur-secrets
          mountPath: /conjur/secrets
        - name: jwt-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
        - name: conjur-ssl
          mountPath: /etc/ssl/conjur
          readOnly: true
        - name: podinfo
          mountPath: /conjur/podinfo
      volumes:
      - name: conjur-secrets
        emptyDir:
          medium: Memory
      - name: jwt-token
        projected:
          sources:
          - serviceAccountToken:
              path: jwt
              expirationSeconds: 6000
              audience: https://conjur-conjur-oss.conjur.svc.cluster.local
      - name: conjur-ssl
        configMap:
          name: conjur-connect
          items:
          - key: CONJUR_SSL_CERTIFICATE
            path: conjur.pem
      # Pod annotations for secrets-provider to read refresh config
      - name: podinfo
        downwardAPI:
          defaultMode: 420
          items:
          - path: annotations
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.annotations
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: jwt-test-app
  annotations:
    reloader.stakater.com/match: "true"
type: Opaque
stringData:
  # Empty values - will be populated by secrets-provider
  username: ""
  password: ""
  # Conjur variable mapping
  conjur-map: |
    username: secrets/username
    password: secrets/password
