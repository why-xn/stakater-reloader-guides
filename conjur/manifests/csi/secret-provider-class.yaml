# SecretProviderClass for Conjur CSI Driver
# Uses secretObjects to sync secrets to K8s Secret for Reloader integration
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: conjur-secrets
  namespace: csi-test-app
spec:
  provider: conjur
  # Sync to Kubernetes Secret - Required for Reloader integration
  secretObjects:
    - secretName: app-secrets
      type: Opaque
      annotations:
        reloader.stakater.com/match: "true"
      data:
        - key: username
          objectName: username.txt
        - key: password
          objectName: password.txt
  parameters:
    conjur.org/configurationVersion: "0.2.0"
    account: myaccount
    applianceUrl: "https://conjur-conjur-oss.conjur.svc.cluster.local"
    authnId: authn-jwt/dev
